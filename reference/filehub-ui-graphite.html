<script>
(() => {
  const root = document.getElementById('fh-design');
  const icons = () => { if (globalThis.lucide) lucide.createIcons({attrs:{width:16,height:16}}); };
  const escapeText = value => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const sampleRoutes = {
    'LYX020822': {path:'临渊行 / 制作 / E02 / S08', detail:'临渊行 / 第 02 集 / 第 08 场 / 镜头 22', name:'02_08_22_02_20260930PM_1080p.mp4'},
    'LYX苏云法相': {path:'临渊行 / 设定 / 角色 / 苏云', detail:'临渊行 / 角色「苏云」/ 备注「法相」', name:'苏云_法相_260930-2_1080p.mp4'},
    'LYXPV决战': {path:'临渊行 / 制作 / PV', detail:'临渊行 / PV / 备注「决战」', name:'PV_决战_260930-1_1080p.mp4'}
  };
  const findRoute = value => sampleRoutes[value.trim()] || null;
  root.querySelectorAll('[data-app]').forEach(app => {
    const home = app.querySelector('[data-home]'), alt = app.querySelector('[data-alt]'), message = app.querySelector('[data-message]');
    const theme = {appearance:'dark', radius:10, compact:true, typeSize:14};
    let paused = false, lastRoute = null, currentView = 'home', priorFocus = null;
    const say = text => { message.textContent = text; };
    function applyDesign() { app.style.colorScheme = theme.appearance === 'system' ? '' : theme.appearance; app.style.setProperty('--fh-radius', theme.radius+'px'); app.style.setProperty('--fh-type', theme.typeSize+'px'); app.dataset.density = theme.compact ? 'compact' : 'relaxed'; }
    function pause() {
      paused = !paused;
      app.querySelectorAll('[data-running]').forEach(el => el.textContent = paused ? '自动整理已暂停' : '自动整理运行中');
      app.querySelectorAll('.fh-dot').forEach(el => el.classList.toggle('paused',paused));
      app.querySelectorAll('[data-pause]').forEach(el => el.textContent = paused ? '继续整理' : '暂停整理');
      app.querySelectorAll('[data-source-status]').forEach(el => el.textContent = paused ? '已暂停' : '已开启');
      say(paused ? '已暂停自动整理，仍可手动送进项目。' : '已恢复自动整理。');
    }
    function renderHistory() {
      alt.innerHTML = '<h1>整理记录</h1><p class="fh-small">每次归档都有迹可循。</p>' + (lastRoute ? '<div class="fh-record"><i data-lucide="film" aria-hidden="true"></i><div><div class="fh-recordname">'+escapeText(lastRoute.name)+'</div><div class="fh-recordpath">'+escapeText(lastRoute.path)+'</div></div><button type="button" class="fh-action cursor-interaction" data-undo>撤销</button></div>' : '') + '<div class="fh-sectiontitle"><h2>今天 · 示例记录</h2></div><div class="fh-record"><i data-lucide="image" aria-hidden="true"></i><div><div class="fh-recordname">苏云_法相_260930-1.png</div><div class="fh-recordpath">桌面 → 临渊行 / 设定 / 角色 / 苏云</div></div><span class="fh-recordtime">14:32</span></div><div class="fh-record"><i data-lucide="folder" aria-hidden="true"></i><div><div class="fh-recordname">灵感参考</div><div class="fh-recordpath">桌面 → 收件箱 / 其他 / 260930</div></div><span class="fh-recordtime">14:20</span></div>';
      const undo = alt.querySelector('[data-undo]');
      if (undo) undo.addEventListener('click', () => { lastRoute=null; app.querySelectorAll('[data-demo-record]').forEach(el=>el.remove()); renderHistory(); say('预览：已撤销归档，文件回到原位置。'); icons(); });
    }
    function navigate(view) {
      currentView=view; say(''); home.hidden=view!=='home'; alt.hidden=view==='home';
      app.querySelectorAll('[data-view]').forEach(el => { if(el.dataset.view===view) el.setAttribute('aria-current','page'); else el.removeAttribute('aria-current'); });
      if(view==='history') renderHistory();
      if(view==='inbox') alt.innerHTML='<h1>收件箱</h1><p class="fh-small">暂时没有归属的文件，在这里留一会儿。</p><div class="fh-inboxempty"><i data-lucide="image" aria-hidden="true"></i><div><strong>图片</strong><p class="fh-small">等待整理</p></div><span>0 项</span></div><div class="fh-inboxempty"><i data-lucide="film" aria-hidden="true"></i><div><strong>视频</strong><p class="fh-small">等待整理</p></div><span>0 项</span></div><div class="fh-inboxempty"><i data-lucide="folder" aria-hidden="true"></i><div><strong>其他</strong><p class="fh-small">灵感参考 · 示例文件夹</p></div><span>1 项</span></div><div class="fh-footer"><span>到期清理由 Mac 负责</span><span>Windows 端已关闭</span></div>';
      if(view==='settings') {
        alt.innerHTML='<h1>设置</h1><p class="fh-small">按你的习惯，安静地运行。</p><div class="fh-settingsrow"><div><strong>同步空间</strong><p>首次使用时选择百度网盘同步目录</p></div><span class="fh-small">示例同步空间</span></div><div class="fh-settingsrow"><div><strong>自动收纳</strong><p>桌面与下载中的闲置文件</p></div><select aria-label="自动收纳时间"><option>3 天后</option>5 天后</option><option>7 天后</option></select></div><div class="fh-settingsrow"><div><strong>登录后自动运行</strong><p>在后台继续整理</p></div><input type="checkbox" checked aria-label="登录后自动运行"></div><div class="fh-settingsrow"><div><strong>外观</strong><p>浅色、深色，或跟随系统</p></div><select data-appearance aria-label="外观"><option value="system">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option></select></div><div class="fh-settingsrow"><div><strong>共享收件箱清理</strong><p>由 Mac 统一处理，避免两边重复清理</p></div><span class="fh-small">已关闭</span></div>';
        const appearance=alt.querySelector('[data-appearance]'); appearance.value=theme.appearance;
        appearance.addEventListener('change',()=>{theme.appearance=appearance.value; applyDesign();});
      }
      icons();
    }
    function complete(route) {
      lastRoute=route;
      app.querySelectorAll('[data-demo-record]').forEach(el=>el.remove());
      const record=document.createElement('div'); record.className='fh-record'; record.dataset.demoRecord='true';
      record.innerHTML='<i data-lucide="film" aria-hidden="true"></i><div><div class="fh-recordname">'+escapeText(route.name)+'</div><div class="fh-recordpath">'+escapeText(route.path)+'</div></div><span class="fh-recordtime">预览 · 刚刚</span>';
      app.querySelector('[data-records]').prepend(record); say('预览：已送进项目。可在「记录」中撤销。'); icons();

    function closeDialog(){const overlay=app.querySelector('.fh-overlay'); if(overlay) overlay.remove(); if(priorFocus?.isConnected) priorFocus.focus();}
    function openDialog() {
      priorFocus=document.activeElement;
      const overlay=document.createElement('div'); overlay.className='fh-overlay';
      overlay.innerHTML='<section class="fh-dialog" role="dialog" aria-modal="true" aria-label="送进项目预览"><form><div class="fh-dialoghead"><h2>送进项目</h2><button type="button" class="cursor-interaction" data-close aria-label="关闭"><i data-lucide="x" aria-hidden="true"></i></button></div><div class="fh-filepill"><i data-lucide="film" aria-hidden="true"></i>镜头素材.mp4<span class="fh-small">· 示例文件</span></div><label for="fh-dialog-code">项目代码与目的地</label><input id="fh-dialog-code" value="LYX020822" spellcheck="false" autocomplete="off" aria-describedby="fh-dialog-result"><div class="fh-routepreview" id="fh-dialog-result" aria-live="polite"></div><div class="fh-dialogfooter"><button type="button" class="fh-action cursor-interaction" data-close>取消</button><button type="submit" class="fh-action primary cursor-interaction" data-submit>送进项目<i data-lucide="arrow-up-right" aria-hidden="true"></i></button></div></form></section>';
      app.append(overlay); const input=overlay.querySelector('input'), result=overlay.querySelector('.fh-routepreview'), submit=overlay.querySelector('[data-submit]');
      function update(){const route=findRoute(input.value); submit.disabled=!route; result.classList.toggle('fh-invalid',!route); result.innerHTML=route ? '<div class="fh-small">'+escapeText(route.path)+'</div>'+escapeText(route.name) : '此预览支持 LYX020822、LYX苏云法相、LYXPV决战。';}
      input.addEventListener('input',update); overlay.querySelectorAll('[data-close]').forEach(el=>el.addEventListener('click',closeDialog));
      submit.type='button';
      const routeNow=()=>{const route=findRoute(input.value);if(route){closeDialog();complete(route);}};
      submit.addEventListener('click',routeNow);
      input.addEventListener('keydown',event=>{if(event.key==='Enter'){event.preventDefault();routeNow();}});
      overlay.querySelector('form').addEventListener('submit',event=>event.preventDefault());
      overlay.addEventListener('keydown',event=>{if(event.key==='Escape'){closeDialog();return;}if(event.key==='Tab'){const items=[...overlay.querySelectorAll('button:not(:disabled),input')];const first=items[0],last=items[items.length-1];if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}}});
      icons();update();input.focus();input.select();
    }
    app.querySelectorAll('[data-view]').forEach(el=>el.addEventListener('click',()=>navigate(el.dataset.view)));
    app.querySelectorAll('[data-goto]').forEach(el=>el.addEventListener('click',()=>navigate(el.dataset.goto)));
    app.querySelectorAll('[data-pause]').forEach(el=>el.addEventListener('click',pause));
    app.querySelectorAll('[data-open-route]').forEach(el=>el.addEventListener('click',openDialog));
    const form=app.querySelector('[data-commandform]');
    if(form){const input=form.querySelector('input'),hint=form.querySelector('[data-codehint]');function update(){const route=findRoute(input.value);hint.textContent=route?route.detail:'此预览支持下方三个示例代码。';hint.classList.toggle('fh-invalid',!route);form.querySelector('button').disabled=!route;}input.addEventListener('input',update);app.querySelectorAll('[data-example]').forEach(el=>el.addEventListener('click',()=>{input.value=el.dataset.example;update();input.focus();}));const routeNow=()=>{const route=findRoute(input.value);if(route)complete(route);};form.querySelector('button').addEventListener('click',routeNow);input.addEventListener('keydown',event=>{if(event.key==='Enter'){event.preventDefault();routeNow();}});form.addEventListener('submit',event=>event.preventDefault());}
    applyDesign();
    if(globalThis.Tweak){const tweak=new Tweak({container:app,onChange:applyDesign});tweak.addSelect(theme,'appearance',{label:'外观',options:[{label:'跟随系统',value:'system'},{label:'浅色',value:'light'},{label:'深色',value:'dark'}]});tweak.addSlider(theme,'typeSize',{label:'正文字号',min:14,max:16,step:1,unit:'px'});tweak.addSlider(theme,'radius',{label:'圆角',min:10,max:24,step:2,unit:'px'});tweak.addToggle(theme,'compact',{label:'紧凑间距'});}
  });
})();
</script>
