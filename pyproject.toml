[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "filehub"
version = "0.3.1"
requires-python = ">=3.12"
dependencies = ["PySide6==6.11.2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--basetemp=sandbox/pytest-tmp"
